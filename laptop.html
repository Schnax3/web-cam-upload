<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop – Foto-Aktion</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; gap: 1rem; }
  header h1 { margin: 0; font-size: 1.5rem; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 22rem; gap: 1.5rem; padding: 0 1.5rem 1.5rem; align-items: start; }
  .panel { background: var(--panel); border-radius: 18px; padding: 1.2rem; }
  .panel h2 { font-size: 1.1rem; }
  .panel p { color: var(--muted); font-size: .9rem; margin: .5em 0; }
  .shoot { display: flex; justify-content: center; margin-top: 1rem; }
  .shoot button { font-size: 1.5rem; padding: .8em 2.4em; }

  /* Ergebnis */
  #result { display: grid; grid-template-columns: 1fr 22rem; gap: 1.5rem; align-items: center; }
  #result .photo { width: 100%; border-radius: 18px; display: block; background: #000; }
  #result .scan { text-align: center; }
  #result .scan h2 { font-size: 1.6rem; }
  #result .qr { width: 100%; max-width: 22rem; margin: 1rem auto; }
  .spinner { width: 3rem; height: 3rem; border: 5px solid #2b3550; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 3rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pairLink { word-break: break-all; font-size: .75rem; color: var(--muted); }

  @media (max-width: 900px) {
    main, #result { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Foto-Aktion</h1>
  <span>
    <span id="serverStatus" class="status">Server: prüfe …</span>
    <span id="phoneStatus" class="status">Handy: nicht verbunden</span>
  </span>
</header>

<main id="camView">
  <section>
    <div class="cam">
      <video id="video" class="mirror" autoplay playsinline muted></video>
      <div id="count" class="count"></div>
      <div id="flash" class="flash"></div>
    </div>
    <div id="camError" class="error hidden"></div>
    <div class="shoot"><button id="shootBtn">📸 Foto machen</button></div>
  </section>
  <aside class="panel">
    <h2>Handy als Kamera nutzen</h2>
    <p>Mit dem Handy scannen, dann Foto am Handy auslösen – das Bild erscheint hier.</p>
    <div id="pairQr" class="qr"></div>
    <p id="pairLink"></p>
  </aside>
</main>

<main id="result" class="hidden">
  <section>
    <img id="photo" class="photo" alt="Dein Foto">
  </section>
  <section class="scan">
    <div id="uploading"><div class="spinner"></div><p>Foto wird hochgeladen …</p></div>
    <div id="uploaded" class="hidden">
      <h2>📱 Scannen &amp; Foto holen</h2>
      <div id="resultQr" class="qr"></div>
      <p id="expiryNote" style="color:var(--muted)"></p>
    </div>
    <div id="uploadError" class="error hidden"></div>
    <p>
      <button id="retryBtn" class="secondary hidden">Nochmal hochladen</button>
      <button id="newBtn">Nächstes Foto</button>
    </p>
  </section>
</main>

<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CFG = window.CONFIG;
  document.title = CFG.TITLE + " – Laptop";
  $("title").textContent = CFG.TITLE;

  let busy = false;
  let lastBlob = null;

  // ---------- Kamera ----------
  async function initCamera() {
    try {
      await WCU.startCamera($("video"), "user");
      $("camError").classList.add("hidden");
    } catch (e) {
      $("camError").textContent = "Laptop-Kamera nicht nutzbar: " + e.message + " (Das Handy kann trotzdem Fotos schicken.)";
      $("camError").classList.remove("hidden");
    }
  }

  $("shootBtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    $("shootBtn").disabled = true;
    try {
      await WCU.countdown($("count"), CFG.COUNTDOWN);
      WCU.flash($("flash"));
      const blob = await WCU.snapshot($("video"));
      showPhoto(blob);
    } catch (e) {
      $("camError").textContent = e.message;
      $("camError").classList.remove("hidden");
    } finally {
      busy = false;
      $("shootBtn").disabled = false;
    }
  });

  // ---------- Ergebnis ----------
  let photoUrl = null;
  async function showPhoto(blob) {
    lastBlob = blob;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(blob);
    $("photo").src = photoUrl;
    $("camView").classList.add("hidden");
    $("result").classList.remove("hidden");
    await upload();
  }

  async function upload() {
    $("uploading").classList.remove("hidden");
    $("uploaded").classList.add("hidden");
    $("uploadError").classList.add("hidden");
    $("retryBtn").classList.add("hidden");
    try {
      const up = await WCU.uploadBlob(lastBlob);
      WCU.renderQR($("resultQr"), WCU.viewerLink(up.publicUrl, up.token));
      const h = up.ttl / 3600;
      $("expiryNote").textContent = "Das Bild ist " + (h >= 1 ? Math.round(h) + " Std." : Math.round(h * 60) + " Min.") + " abrufbar.";
      $("uploading").classList.add("hidden");
      $("uploaded").classList.remove("hidden");
    } catch (e) {
      $("uploading").classList.add("hidden");
      $("uploadError").textContent = e.message;
      $("uploadError").classList.remove("hidden");
      $("retryBtn").classList.remove("hidden");
    }
  }

  $("retryBtn").addEventListener("click", upload);
  $("newBtn").addEventListener("click", () => {
    $("result").classList.add("hidden");
    $("camView").classList.remove("hidden");
    lastBlob = null;
  });

  // ---------- Handy-Kopplung (PeerJS) ----------
  const ALPHABET = "abcdefghjkmnpqrstuvwxyz23456789";
  function makeCode() {
    let s = "";
    const r = crypto.getRandomValues(new Uint8Array(6));
    for (let i = 0; i < 6; i++) s += ALPHABET[r[i] % ALPHABET.length];
    return s;
  }
  let code = localStorage.getItem("wcu-code") || makeCode();
  let peer = null;
  const conns = new Set();

  function setPhoneStatus() {
    const n = conns.size;
    const el = $("phoneStatus");
    if (n > 0) { el.textContent = "Handy verbunden ✓"; el.className = "status ok"; }
    else { el.textContent = "Handy: nicht verbunden"; el.className = "status"; }
  }

  function showPairing() {
    const link = WCU.baseUrl() + "handy.html#" + code;
    WCU.renderQR($("pairQr"), link);
    $("pairLink").textContent = link;
  }

  function startPeer() {
    localStorage.setItem("wcu-code", code);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = new Peer("wcu-" + code);
    peer.on("open", showPairing);
    peer.on("connection", (c) => {
      c.on("open", () => { conns.add(c); setPhoneStatus(); });
      c.on("close", () => { conns.delete(c); setPhoneStatus(); });
      c.on("error", () => { conns.delete(c); setPhoneStatus(); });
      c.on("data", (msg) => {
        if (msg && msg.kind === "photo" && msg.data) {
          const blob = new Blob([msg.data], { type: "image/jpeg" });
          try { c.send({ kind: "received" }); } catch (e) {}
          showPhoto(blob);
        }
      });
    });
    peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
    peer.on("error", (err) => {
      if (err.type === "unavailable-id") {
        code = makeCode();
        startPeer();
      } else {
        $("pairLink").textContent = "Verbindung zum Kopplungs-Server fehlgeschlagen (" + err.type + "). Neuer Versuch …";
        setTimeout(startPeer, 5000);
      }
    });
  }

  // ---------- Foto-Server prüfen ----------
  async function checkServer() {
    const el = $("serverStatus");
    try {
      const info = await WCU.serverInfo();
      if (info.public_url) { el.textContent = "Server ✓"; el.className = "status ok"; }
      else { el.textContent = "Server ohne Tunnel"; el.className = "status err"; }
    } catch (e) {
      el.textContent = "Server nicht erreichbar"; el.className = "status err";
    }
  }

  initCamera();
  startPeer();
  checkServer();
  setInterval(checkServer, 10000);
})();
</script>
</body>
</html>
