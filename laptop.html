<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto-Aktion</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { cursor: default; }
  body.idle { cursor: none; }

  /* Zwei Hälften: links Livebild, rechts QR-Code zum letzten Foto */
  #app { display: grid; grid-template-columns: 1fr 1fr; width: 100vw; height: 100vh; }
  #live { position: relative; background: #000; overflow: hidden; }
  #live video, #live img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #live video.mirror { transform: scaleX(-1); }
  .note { position: absolute; left: 1rem; right: 1rem; bottom: 1rem; text-align: center; }

  #side { position: relative; background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .view { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; width: 100%; }
  .view h2 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.6rem); }
  .view p { margin: 0; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.4rem); max-width: 28rem; }
  .qr { width: min(38vw, 70vh); }
  .big { font-size: clamp(4rem, 10vw, 9rem); line-height: 1; }
  .spinner { width: 4rem; height: 4rem; border: 6px solid #2b3550; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pairLink { word-break: break-all; font-size: .75rem !important; }
  .sysnote { position: absolute; left: 1rem; right: 1rem; bottom: .8rem; margin: 0; font-size: .85rem; color: var(--muted); }

  @media (max-aspect-ratio: 1/1) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .qr { width: min(60vw, 38vh); }
  }
</style>
</head>
<body>

<div id="app">
  <section id="live">
    <video id="video" class="mirror" autoplay playsinline muted></video>
    <img id="phoneStream" class="hidden" alt="">
    <div id="count" class="count"></div>
    <div id="flash" class="flash"></div>
    <span id="note" class="status err note hidden"></span>
  </section>

  <section id="side">
    <!-- Handy koppeln (nur solange noch kein Handy verbunden und noch kein Foto gemacht wurde) -->
    <div id="vPair" class="view hidden">
      <div id="pairQr" class="qr"></div>
      <h2>📱 Handy als Kamera koppeln</h2>
      <p>Handy quer halten, ins selbe WLAN, QR-Code scannen.</p>
      <p id="pairLink"></p>
      <p id="certHint" class="hidden">Beim ersten Mal: Zertifikatswarnung mit „Erweitert“ → „Trotzdem fortfahren“ bestätigen.</p>
    </div>
    <!-- Noch kein Foto -->
    <div id="vWait" class="view hidden">
      <div class="big">📸</div>
      <h2>Gleich geht’s los</h2>
      <p>Hier erscheint der QR-Code zu deinem Foto.</p>
    </div>
    <!-- Foto wird vorbereitet -->
    <div id="vBusy" class="view hidden">
      <div class="spinner"></div>
      <p id="busyNote">Foto wird vorbereitet …</p>
    </div>
    <!-- QR-Code zum letzten Foto -->
    <div id="vQr" class="view hidden">
      <div id="resultQr" class="qr"></div>
      <h2>📱 Scannen &amp; Foto holen</h2>
    </div>
    <!-- Fehler -->
    <div id="vErr" class="view hidden">
      <p id="errText" class="error"></p>
    </div>
    <p id="sysNote" class="sysnote hidden"></p>
  </section>
</div>

<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CFG = window.CONFIG;
  document.title = CFG.TITLE;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const fit = CFG.VIEW_FIT === "contain" ? "contain" : "cover";
  $("video").style.objectFit = fit;
  $("phoneStream").style.objectFit = fit;

  let busy = false;
  let phoneOn = false;
  let seqSeen = null;
  let lanUrl = null;
  let pairForced = false;                 // Taste P blendet den Kopplungs-QR ein/aus
  let photo = { state: "none" };          // none | uploading | ready | error
  let photoGen = 0;

  // ---------- rechte Hälfte ----------
  function renderSide() {
    let show;
    const pairing = lanUrl && !phoneOn && (photo.state === "none" || pairForced);
    if (pairing) show = "vPair";
    else if (photo.state === "uploading") show = "vBusy";
    else if (photo.state === "ready") show = "vQr";
    else if (photo.state === "error") show = "vErr";
    else show = "vWait";
    ["vPair", "vWait", "vBusy", "vQr", "vErr"].forEach((v) => $(v).classList.toggle("hidden", v !== show));
  }

  function setPhoto(p) {
    photo = p;
    if (p.state === "ready") WCU.renderQR($("resultQr"), p.link);
    if (p.state === "uploading") $("busyNote").textContent = p.note || "Foto wird vorbereitet …";
    if (p.state === "error") $("errText").textContent = p.msg;
    renderSide();
  }

  // Foto steht auf dem Server (Token), jetzt auf die Abhol-Adresse (Tunnel) warten und QR zeigen
  async function showPhoto(getToken) {
    const gen = ++photoGen;
    setPhoto({ state: "uploading" });
    let token;
    try {
      token = await getToken();
    } catch (e) {
      if (gen === photoGen) setPhoto({ state: "error", msg: e.message });
      return;
    }
    for (let attempt = 0; attempt < 40; attempt++) {
      try {
        const info = await WCU.serverInfo();
        if (gen !== photoGen) return;
        if (info.public_url) {
          setPhoto({ state: "ready", link: WCU.viewerLink(info.public_url, token) });
          return;
        }
        setPhoto({ state: "uploading", note: "Verbindung wird aufgebaut …" });
      } catch (e) {
        if (gen !== photoGen) return;
        setPhoto({ state: "uploading", note: "Server nicht erreichbar …" });
      }
      await sleep(2000);
      if (gen !== photoGen) return;
    }
    if (gen === photoGen) setPhoto({ state: "error", msg: "Keine Verbindung zum Tunnel. Internet prüfen." });
  }

  // ---------- Hinweis links unten (nur für Fehler) ----------
  let noteTimer = null;
  function note(text) {
    const el = $("note");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => el.classList.add("hidden"), 6000);
  }

  // ---------- Laptop-Kamera ----------
  async function initCamera() {
    try {
      await WCU.startCamera($("video"), "user");
      $("note").classList.add("hidden");
    } catch (e) {
      note("Laptop-Kamera nicht nutzbar: " + e.message);
    }
  }

  // ---------- Enter: Foto auslösen (Handy, falls verbunden, sonst Laptop-Kamera) ----------
  async function shoot() {
    if (busy) return;
    busy = true;
    try {
      await WCU.countdown($("count"), CFG.COUNTDOWN);
      if (phoneOn) {
        await WCU.sendCmd("shoot");
        setTimeout(() => { if (waiting && Date.now() - waiting >= 9000) { waiting = 0; note("Das Handy hat kein Foto geschickt."); } }, 10000);
        waiting = Date.now();
      } else {
        WCU.flash($("flash"));
        const blob = await WCU.snapshot($("video"));
        showPhoto(() => WCU.saveBlob(blob));
      }
    } catch (e) {
      note(e.message);
    } finally {
      busy = false;
    }
  }
  let waiting = 0; // Zeitpunkt, seit dem auf ein Foto vom Handy gewartet wird

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }

  // Tasten: Enter = Foto, F = Vollbild, P = Kopplungs-QR ein/aus (für ein zweites Handy)
  let lastEnter = 0;
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") {
      e.preventDefault();
      if (e.repeat || Date.now() - lastEnter < 600) return;
      lastEnter = Date.now();
      shoot();
    } else if (e.key === "f" || e.key === "F") {
      toggleFullscreen();
    } else if (e.key === "p" || e.key === "P") {
      pairForced = !pairForced;
      renderSide();
    }
  }, true);

  // Mauszeiger nach 2 Sekunden Ruhe ausblenden
  let idleTimer = null;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 2000);
  }
  document.addEventListener("mousemove", wake);
  wake();

  // ---------- Handy hat Vorrang ----------
  function connectStream() {
    $("phoneStream").src = WCU.server() + "/stream?" + Date.now();
  }
  // Reißt das Livebild ab, während das Handy noch verbunden ist, neu verbinden
  $("phoneStream").addEventListener("error", () => {
    if (phoneOn) setTimeout(() => { if (phoneOn) connectStream(); }, 1000);
  });

  function setPhone(on) {
    if (on === phoneOn) return;
    phoneOn = on;
    if (on) {
      pairForced = false;
      WCU.stopCamera();
      $("video").classList.add("hidden");
      $("phoneStream").classList.remove("hidden");
      connectStream();
    } else {
      $("phoneStream").removeAttribute("src");
      $("phoneStream").classList.add("hidden");
      $("video").classList.remove("hidden");
      initCamera();
    }
    renderSide();
  }

  // ---------- Server abfragen ----------
  async function poll() {
    const sys = $("sysNote");
    try {
      const s = await WCU.serverStatus();
      if (seqSeen === null) {
        seqSeen = s.seq;
        // Seite neu geladen: QR zum letzten Foto gleich wieder zeigen
        if (s.latest) showPhoto(() => Promise.resolve(s.latest));
      } else if (s.seq !== seqSeen) {
        seqSeen = s.seq;
        waiting = 0;
        WCU.flash($("flash"));
        if (s.token) showPhoto(() => Promise.resolve(s.token));
      }
      setPhone(s.phone);
      if (s.tunnel) sys.classList.add("hidden");
      else { sys.textContent = "Tunnel startet …"; sys.classList.remove("hidden"); }
    } catch (e) {
      sys.textContent = "Server nicht erreichbar. Läuft foto_server.py?";
      sys.classList.remove("hidden");
    }
  }

  async function loadInfo() {
    try {
      const info = await WCU.serverInfo();
      if (info.lan_url && info.lan_url !== lanUrl) {
        lanUrl = info.lan_url;
        WCU.renderQR($("pairQr"), info.lan_url);
        $("pairLink").textContent = info.lan_url;
        $("certHint").classList.toggle("hidden", !info.tls);
        renderSide();
      }
    } catch (e) { /* poll() zeigt den Fehler */ }
  }

  (async function start() {
    renderSide();
    await poll();
    await loadInfo();
    if (!phoneOn) initCamera();
    setInterval(poll, 1000);
    setInterval(loadInfo, 5000);
  })();
})();
</script>
</body>
</html>
