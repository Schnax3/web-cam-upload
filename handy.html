<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handy – Foto-Aktion</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; padding: 1.5rem; text-align: center; min-height: 100%; }
  h1 { margin: 0; font-size: 1.5rem; }
  .big { width: min(80vw, 20rem); font-size: 1.3rem; padding: 1.4em 1em; }
  .row { display: flex; flex-direction: column; gap: .8rem; align-items: center; }
  #thumb { width: min(80vw, 20rem); max-height: 35vh; object-fit: contain; border-radius: 14px; background: #000; }
  .hint { color: var(--muted); max-width: 26rem; margin: 0; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1 id="title">📱 Handy-Kamera</h1>
  <span id="conn" class="status">Verbinde …</span>

  <div id="noKey" class="error hidden">
    Kein Schlüssel im Link. Bitte den QR-Code auf der Laptop-Seite scannen.
  </div>

  <div id="main" class="row">
    <button id="backBtn" class="big">📷 Foto aufnehmen</button>
    <button id="selfieBtn" class="big secondary">🤳 Selfie</button>
    <img id="thumb" class="hidden" alt="Letztes Foto">
    <span id="msg" class="status hidden"></span>
    <p class="hint">Es öffnet sich die Kamera-App deines Handys. Nach dem Foto wird es automatisch an den Laptop geschickt.</p>
  </div>

  <input id="fileBack" type="file" accept="image/*" capture="environment">
  <input id="fileSelfie" type="file" accept="image/*" capture="user">

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const CFG = window.CONFIG;
  document.title = CFG.TITLE + " – Handy";

  const key = location.hash.replace(/^#/, "").trim();
  if (!key) {
    $("main").classList.add("hidden");
    $("conn").classList.add("hidden");
    $("noKey").classList.remove("hidden");
    return;
  }

  function setConn(ok) {
    const el = $("conn");
    el.textContent = ok ? "Mit Laptop verbunden ✓" : "Keine Verbindung zum Laptop";
    el.className = "status " + (ok ? "ok" : "err");
  }

  function setMsg(text, cls) {
    const el = $("msg");
    el.textContent = text;
    el.className = "status " + (cls || "");
  }

  // Lebenszeichen: so weiß der Laptop, dass ein Handy da ist (dann hat das Handy Vorrang)
  async function hello() {
    try {
      const r = await fetch("/phone/hello", { method: "POST", headers: { "X-Key": key }, cache: "no-store" });
      if (r.status === 403) { setConn(false); $("conn").textContent = "Schlüssel falsch – QR neu scannen"; return; }
      setConn(r.ok);
    } catch (e) {
      setConn(false);
    }
  }
  hello();
  setInterval(hello, 3000);

  // Foto verkleinern und als JPEG ausgeben (Drehung aus den Kamera-Daten wird vom Browser beachtet)
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, CFG.MAX_SIZE / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error("Foto konnte nicht verarbeitet werden."))), "image/jpeg", 0.88);
      };
      img.onerror = () => reject(new Error("Foto konnte nicht gelesen werden."));
      img.src = url;
    });
  }

  async function handleFile(input) {
    const file = input.files && input.files[0];
    input.value = ""; // dieselbe Datei später erneut wählbar
    if (!file) return;
    setMsg("Foto wird gesendet …", "");
    try {
      const blob = await shrink(file);
      const r = await fetch("/phone/photo", {
        method: "POST",
        headers: { "X-Key": key, "Content-Type": "image/jpeg" },
        body: blob,
      });
      if (!r.ok) throw new Error(r.status === 403 ? "Schlüssel falsch – QR neu scannen." : "Senden fehlgeschlagen (" + r.status + ").");
      const t = $("thumb");
      if (t.src) URL.revokeObjectURL(t.src);
      t.src = URL.createObjectURL(blob);
      t.classList.remove("hidden");
      setMsg("Foto angekommen ✓ – QR-Code steht am Laptop", "ok");
    } catch (e) {
      setMsg(e.message || "Senden fehlgeschlagen.", "err");
    }
  }

  $("backBtn").addEventListener("click", () => $("fileBack").click());
  $("selfieBtn").addEventListener("click", () => $("fileSelfie").click());
  $("fileBack").addEventListener("change", (e) => handleFile(e.target));
  $("fileSelfie").addEventListener("change", (e) => handleFile(e.target));
})();
</script>
</body>
</html>
