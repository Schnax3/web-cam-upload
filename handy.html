<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handy – Foto-Aktion</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow: hidden; }
  body { position: fixed; inset: 0; }
  #camView { position: absolute; inset: 0; background: #000; }
  #camView video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #camView video.mirror { transform: scaleX(-1); }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + .8rem) 1rem 0; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 1rem 1rem calc(env(safe-area-inset-bottom) + 1.4rem); display: flex; justify-content: center; align-items: center; }
  .shutter { width: 5.2rem; height: 5.2rem; border-radius: 50%; padding: 0; background: #fff; border: 6px solid rgba(255,255,255,.45); background-clip: padding-box; }
  .shutter:disabled { opacity: .4; }
  .flip { position: absolute; right: 1.5rem; bottom: calc(env(safe-area-inset-bottom) + 2rem); width: 3.4rem; height: 3.4rem; border-radius: 50%; padding: 0; font-size: 1.5rem; background: rgba(0,0,0,.5); }
  .toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 8rem); transform: translateX(-50%); max-width: 90%; }

  #result { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 1rem) 1.2rem 2rem; text-align: center; }
  #result img { width: 100%; max-height: 30vh; object-fit: contain; border-radius: 14px; background: #000; }
  #result .qr { width: min(80vw, 20rem); margin: 1rem auto; }
  .spinner { width: 3rem; height: 3rem; border: 5px solid #2b3550; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="camView">
  <video id="video" autoplay playsinline muted></video>
  <div id="count" class="count"></div>
  <div id="flash" class="flash"></div>
  <div class="top">
    <span id="modeStatus" class="status">…</span>
  </div>
  <div id="toast" class="toast status err hidden"></div>
  <div class="bottom">
    <button id="shootBtn" class="shutter" aria-label="Foto machen"></button>
    <button id="flipBtn" class="flip" aria-label="Kamera wechseln">🔄</button>
  </div>
</div>

<div id="result" class="hidden">
  <img id="photo" alt="Dein Foto">
  <div id="uploading"><div class="spinner"></div><p>Foto wird hochgeladen …</p></div>
  <div id="uploaded" class="hidden">
    <h2>📱 Scannen &amp; Foto holen</h2>
    <div id="resultQr" class="qr"></div>
  </div>
  <div id="uploadError" class="error hidden"></div>
  <p>
    <button id="retryBtn" class="secondary hidden">Nochmal hochladen</button>
    <button id="newBtn">Nächstes Foto</button>
  </p>
</div>

<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CFG = window.CONFIG;
  document.title = CFG.TITLE + " – Handy";

  // Code aus dem Link (…/handy.html#abc123) => Kopplung mit Laptop, sonst eigenständig
  const code = location.hash.replace("#", "").trim();
  const paired = code.length > 0;

  let facing = "environment";
  let busy = false;
  let lastBlob = null;
  let conn = null;
  let peer = null;

  function setMode(text, cls) {
    const el = $("modeStatus");
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }

  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 3500);
  }

  // ---------- Kamera ----------
  async function initCamera() {
    try {
      await WCU.startCamera($("video"), facing);
      $("video").classList.toggle("mirror", facing === "user");
    } catch (e) {
      toast("Kamera: " + e.message);
    }
  }

  $("flipBtn").addEventListener("click", async () => {
    facing = facing === "environment" ? "user" : "environment";
    await initCamera();
  });

  $("shootBtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    $("shootBtn").disabled = true;
    try {
      await WCU.countdown($("count"), CFG.COUNTDOWN);
      WCU.flash($("flash"));
      let blob = await WCU.snapshot($("video"));
      if (paired) await sendToLaptop(blob);
      else await showResult(blob);
    } catch (e) {
      toast(e.message);
    } finally {
      busy = false;
      $("shootBtn").disabled = false;
    }
  });

  // ---------- Modus A: an Laptop schicken ----------
  async function sendToLaptop(blob) {
    if (!conn || !conn.open) throw new Error("Nicht mit dem Laptop verbunden.");
    conn.send({ kind: "photo", data: await blob.arrayBuffer() });
    setMode("Gesendet …", "");
  }

  function connectToLaptop() {
    setMode("Verbinde mit Laptop …", "");
    peer = new Peer();
    peer.on("open", () => {
      conn = peer.connect("wcu-" + code, { reliable: true });
      conn.on("open", () => setMode("Mit Laptop verbunden ✓", "ok"));
      conn.on("data", (msg) => { if (msg && msg.kind === "received") setMode("Foto angekommen ✓", "ok"); });
      conn.on("close", () => { setMode("Verbindung weg – neuer Versuch …", "err"); retry(); });
      conn.on("error", () => { setMode("Verbindungsfehler …", "err"); retry(); });
    });
    peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
    peer.on("error", (err) => {
      setMode(err.type === "peer-unavailable" ? "Laptop nicht gefunden …" : "Verbindungsfehler …", "err");
      retry();
    });
  }
  let retryTimer = null;
  function retry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
      try { if (peer) peer.destroy(); } catch (e) {}
      connectToLaptop();
    }, 3000);
  }

  // ---------- Modus B: eigenständig, QR auf dem Handy ----------
  async function showResult(blob) {
    lastBlob = blob;
    $("photo").src = URL.createObjectURL(blob);
    $("camView").classList.add("hidden");
    $("result").classList.remove("hidden");
    await upload();
  }

  async function upload() {
    $("uploading").classList.remove("hidden");
    $("uploaded").classList.add("hidden");
    $("uploadError").classList.add("hidden");
    $("retryBtn").classList.add("hidden");
    try {
      const imageUrl = await WCU.uploadBlob(lastBlob);
      WCU.renderQR($("resultQr"), WCU.viewerLink(imageUrl));
      $("uploading").classList.add("hidden");
      $("uploaded").classList.remove("hidden");
    } catch (e) {
      $("uploading").classList.add("hidden");
      $("uploadError").textContent = e.message;
      $("uploadError").classList.remove("hidden");
      $("retryBtn").classList.remove("hidden");
    }
  }

  $("retryBtn").addEventListener("click", upload);
  $("newBtn").addEventListener("click", () => {
    $("result").classList.add("hidden");
    $("camView").classList.remove("hidden");
    lastBlob = null;
  });

  // ---------- Start ----------
  initCamera();
  if (paired) connectToLaptop();
  else setMode("Eigenständig (QR hier am Handy)", "");
})();
</script>
</body>
</html>
