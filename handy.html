<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handy – externe Kamera</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow: hidden; }
  body { position: fixed; inset: 0; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  video.mirror { transform: scaleX(-1); }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + .8rem) 1rem 0; display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; }
  .bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 1rem 1rem calc(env(safe-area-inset-bottom) + 1.2rem); text-align: center; }
  .bottom .status { background: rgba(0, 0, 0, .55); }
  #msg { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; text-align: center; }
  #msg p { color: var(--muted); max-width: 26rem; }
</style>
</head>
<body>

<div id="msg" class="hidden"><h1 id="msgTitle"></h1><p id="msgText"></p></div>

<video id="video" autoplay playsinline muted></video>
<div id="flash" class="flash"></div>
<div class="top"><span id="conn" class="status">Verbinde …</span></div>
<div class="bottom"><span class="status">Externe Kamera – wird vom Laptop gesteuert</span> <span id="note" class="status hidden"></span></div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const CFG = window.CONFIG;
  const video = $("video");

  function fatal(title, text) {
    $("msgTitle").textContent = title;
    $("msgText").textContent = text;
    $("msg").classList.remove("hidden");
  }

  const key = location.hash.replace(/^#/, "").trim();
  if (!key) {
    return fatal("📱 Externe Kamera", "Kein Schlüssel im Link. Bitte den QR-Code auf der Laptop-Seite scannen.");
  }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return fatal("Kamera nicht erlaubt",
      "Der Browser erlaubt die Kamera nur über https. Der Laptop braucht dafür das Python-Paket „cryptography“ (pip install cryptography). Danach den Server neu starten und den QR-Code erneut scannen.");
  }

  function setConn(ok, text) {
    const el = $("conn");
    el.textContent = text || (ok ? "Mit Laptop verbunden ✓" : "Keine Verbindung zum Laptop");
    el.className = "status " + (ok ? "ok" : "err");
  }

  let noteTimer = null;
  function note(text) {
    const el = $("note");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => el.classList.add("hidden"), 3000);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------- Kamera ----------
  let facing = "environment";
  let stream = null;

  async function startCam() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    video.classList.toggle("mirror", facing === "user");
  }

  // Bildschirm anlassen, solange die Seite offen ist
  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

  // Standbild als JPEG (längste Kante maxDim)
  function grab(maxDim, quality) {
    const w = video.videoWidth, h = video.videoHeight;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * scale);
    c.height = Math.round(h * scale);
    c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
    return new Promise((resolve, reject) =>
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Bild konnte nicht erstellt werden."))), "image/jpeg", quality)
    );
  }

  function flash() {
    const f = $("flash");
    f.classList.remove("go");
    void f.offsetWidth;
    f.classList.add("go");
  }

  // ---------- Befehle vom Laptop ----------
  async function shoot() {
    flash();
    const blob = await grab(CFG.MAX_SIZE, 0.88); // volle Qualität nur für das Foto
    const r = await fetch("/phone/photo", {
      method: "POST",
      headers: { "X-Key": key, "Content-Type": "image/jpeg" },
      body: blob,
    });
    if (!r.ok) throw new Error("Foto senden fehlgeschlagen (" + r.status + ")");
    note("Foto gesendet ✓");
  }

  async function handle(cmd) {
    try {
      if (cmd === "shoot") await shoot();
      else if (cmd === "flip") {
        facing = facing === "environment" ? "user" : "environment";
        await startCam();
        note(facing === "user" ? "Frontkamera" : "Rückkamera");
      }
    } catch (e) {
      note(e.message || "Fehler");
    }
  }

  // ---------- Livebild senden (ca. 9 Bilder pro Sekunde); die Antwort enthält Befehle ----------
  async function loop() {
    for (;;) {
      const t0 = performance.now();
      try {
        if (video.videoWidth) {
          const frame = await grab(640, 0.6);
          const r = await fetch("/phone/frame", {
            method: "POST",
            headers: { "X-Key": key, "Content-Type": "image/jpeg" },
            body: frame,
            cache: "no-store",
          });
          if (r.status === 403) {
            setConn(false, "Schlüssel falsch – QR neu scannen");
            await sleep(2000);
            continue;
          }
          if (!r.ok) throw new Error("Status " + r.status);
          setConn(true);
          const j = await r.json();
          for (const c of j.cmds || []) await handle(c);
        }
      } catch (e) {
        setConn(false);
        await sleep(1000);
      }
      const dt = performance.now() - t0;
      if (dt < 110) await sleep(110 - dt);
    }
  }

  (async function start() {
    try {
      await startCam();
    } catch (e) {
      return fatal("Kamera nicht verfügbar", "Bitte die Kamera-Freigabe erlauben und die Seite neu laden. (" + (e.message || e) + ")");
    }
    keepAwake();
    loop();
  })();
})();
</script>
</body>
</html>
